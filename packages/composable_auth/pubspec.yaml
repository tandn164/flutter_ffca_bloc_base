name: composable_auth
description: Authentication service with configurable auth modes and smart token refresh
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Required Core Package
  composable_core:
    path: ../composable_core
  
  # Required Network Package for API calls
  composable_network:
    path: ../composable_network
    
  # State Management
  flutter_bloc: ^9.1.1
  
  # DI
  get_it: ^8.3.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # JWT decode for smart refresh
  jwt_decoder: ^2.0.1
  
  # Logging
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mockito: ^5.4.2
  build_runner: ^2.4.7

flutter: