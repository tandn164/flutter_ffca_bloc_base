name: composable_ui_kit
description: ComposableCore — Design tokens, theme extensions, type-safe assets
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Required Core Package  
  composable_core:
    path: ../composable_core
  
  # SVG Support
  flutter_svg: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Type-safe asset generation
  flutter_gen_runner: ^5.4.0
  build_runner: ^2.15.0

flutter_gen:
  output: lib/src/assets/
  line_length: 80
  
  # Type-safe asset generation config
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
      style: snake-case
    
  fonts:
    enabled: true
    
  colors:
    enabled: false  # We'll use ThemeExtension instead

flutter:
  assets:
    - assets/icons/
    - assets/images/