name: feed_presentation
description: Feed Flutter UI and BLoC. No GetIt. No data-layer package.
version: 1.0.0
publish_to: "none"

environment:
  sdk: ^3.6.0
  flutter: ">=3.16.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  feed_domain:
    path: ../feed_domain
  ui_kit:
    path: ../../../shared/ui_kit

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  app_result:
    path: ../../../shared/app_result
