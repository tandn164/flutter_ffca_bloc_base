name: sample_app
description: Sample app — Feature-First Clean Architecture + BLoC composition root.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get_it: ^8.0.3
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  go_router: ^14.6.2
  http: ^1.1.0
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.2.0
  chopper: ^8.1.0
  app_result:
    path: ../../shared/app_result
  app_connectivity:
    path: ../../shared/connectivity
  app_overlay:
    path: ../../shared/app_overlay
  tutorial_engine:
    path: ../../shared/tutorial_engine
  local_storage:
    path: ../../shared/local_storage/core
  local_storage_shared_preferences:
    path: ../../shared/local_storage/stores/shared_preferences
  offline_sync:
    path: ../../shared/offline_sync
  api_client:
    path: ../../shared/api_client
  ui_kit:
    path: ../../shared/ui_kit
  app_session:
    path: ../../shared/session
  interceptor:
    path: ../../shared/interceptor
  app_navigation:
    path: ../../shared/navigation
  app_logging:
    path: ../../shared/logging
  app_push:
    path: ../../shared/push
  feed_domain:
    path: ../../features/feed/feed_domain
  feed_data:
    path: ../../features/feed/feed_data
  feed_presentation:
    path: ../../features/feed/feed_presentation
  auth_domain:
    path: ../../features/auth/auth_domain
  auth_data:
    path: ../../features/auth/auth_data
  auth_presentation:
    path: ../../features/auth/auth_presentation
  profile_domain:
    path: ../../features/profile/profile_domain
  profile_data:
    path: ../../features/profile/profile_data
  profile_presentation:
    path: ../../features/profile/profile_presentation
  onboarding_domain:
    path: ../../features/onboarding/onboarding_domain
  onboarding_data:
    path: ../../features/onboarding/onboarding_data
  onboarding_presentation:
    path: ../../features/onboarding/onboarding_presentation
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
