name: sample_app
description: Sample app — Feature-First Clean Architecture + BLoC composition root.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  injectable: ^2.5.0
  go_router: ^14.6.2
  intl: ^0.20.2
  shared_preferences: ^2.2.0
  app_connectivity:
    path: ../../shared/connectivity
  app_overlay:
    path: ../../shared/app_overlay
  tutorial_engine:
    path: ../../shared/tutorial_engine
  local_storage:
    path: ../../shared/local_storage/core
  local_storage_shared_preferences:
    path: ../../shared/local_storage/stores/shared_preferences
  ui_kit:
    path: ../../shared/ui_kit
  app_navigation:
    path: ../../shared/navigation
  app_logging:
    path: ../../shared/logging
  sample_domain:
    path: ../../features/sample/sample_domain
  sample_data:
    path: ../../features/sample/sample_data
  sample_presentation:
    path: ../../features/sample/sample_presentation
  onboarding_domain:
    path: ../../features/onboarding/onboarding_domain
  onboarding_data:
    path: ../../features/onboarding/onboarding_data
  onboarding_presentation:
    path: ../../features/onboarding/onboarding_presentation
dev_dependencies:
  build_runner: ^2.4.13
  injectable_generator: ^2.7.0
  go_router_builder: 2.8.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
  generate: true
